<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema BR3 - Controle de Almoço</title>
    <!-- Bibliotecas Necessárias -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #2c3e50; --secondary: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 800px; }
        #login-screen { text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #eee; color: #333; flex: 1; padding: 10px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <h2><i class="fas fa-utensils"></i> Sistema BR3</h2>
        <input type="text" id="user" placeholder="Usuário (Ex: arthuruwillian)">
        <div style="position:relative;">
            <input type="password" id="pass" placeholder="Senha">
            <i id="togglePassword" class="fas fa-eye" style="position:absolute; right:10px; top:20px; cursor:pointer;"></i>
        </div>
        <button onclick="autenticar()">ENTRAR</button>
    </div>

    <!-- SISTEMA PRINCIPAL (Inicia oculto) -->
    <div id="main-system" style="display:none;">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'aba-daily')">Lançamento</button>
            <button class="tab-btn" onclick="openTab(event, 'aba-db')">Funcionários</button>
            <button class="tab-btn" onclick="openTab(event, 'aba-mensal')">Fechamento</button>
        </div>

        <!-- ABA LANÇAMENTO -->
        <div id="aba-daily" class="tab-content active">
            <input type="date" id="data-dia" onchange="verificarData()">
            <div style="display:flex; gap:10px;">
                <input type="number" id="v-colab" step="0.01" placeholder="Valor Colab">
                <input type="number" id="v-emp" step="0.01" placeholder="Valor Emp">
            </div>
            <table id="table-daily">
                <thead><tr><th>Código</th><th>Nome</th></tr></thead>
                <tbody id="body-daily"></tbody>
            </table>
            <button onclick="salvarDia()" style="margin-top:15px; background: #27ae60;">SALVAR DIA</button>
        </div>

        <!-- ABA DATABASE -->
        <div id="aba-db" class="tab-content">
            <h3>Cadastro de Funcionários</h3>
            <table id="table-db">
                <thead><tr><th>Ref</th><th>Código Real</th><th>Nome Completo</th></tr></thead>
                <tbody id="body-db"></tbody>
            </table>
            <button onclick="salvarDB()" style="margin-top:15px;">SALVAR LISTA</button>
        </div>

        <!-- ABA FECHAMENTO -->
        <div id="aba-mensal" class="tab-content">
            <input type="month" id="filtro-mes" onchange="gerarMensal()">
            <table id="tabela-mensal">
                <thead><tr><th>Cod</th><th>Real</th><th>Nome</th><th>Qtd</th><th>Total Colab</th><th>Total Emp</th></tr></thead>
                <tbody id="body-mensal"></tbody>
            </table>
            <button onclick="exportarExcel()" style="margin-top:15px; background: #f39c12;">EXPORTAR EXCEL</button>
        </div>
    </div>
</div>

<script>
    // Configurações do seu Firebase (conforme image_d64678.png)
    const firebaseConfig = {
        apiKey: "AIzaSyC7MB3d7zwXhrQiryyhDn6iJO-R47Ckbp8",
        authDomain: "sistema-br3.firebaseapp.com",
        databaseURL: "https://sistema-br3-default-rtdb.firebaseio.com/",
        projectId: "sistema-br3",
        storageBucket: "sistema-br3.firebasestorage.app",
        messagingSenderId: "794505118512",
        appId: "1:794505118512:web:646af1ce3a841f933dfef5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let historico = [];

    function autenticar() {
        const u = document.getElementById('user').value.toLowerCase();
        const p = document.getElementById('pass').value;
        if ((u === "arthurowillian" || u === "arthur.oliveira" || u === "laura") && p === "123") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-system').style.display = 'block';
            init();
        } else { alert("Acesso negado"); }
    }

    function init() {
        renderRows('body-db', 500, 3);
        renderRows('body-daily', 100, 2);
        document.getElementById('data-dia').value = new Date().toISOString().split('T')[0];
        document.getElementById('v-colab').value = '3.25';
        document.getElementById('v-emp').value = '16.23';

        db.ref('br3_database').on('value', s => {
            const d = s.val() || [];
            const ins = document.querySelectorAll('#body-db input');
            d.forEach((v, i) => { if(ins[i]) ins[i].value = v; });
        });

        db.ref('br3_historico').on('value', s => {
            historico = s.val() || [];
            verificarData();
        });
    }

    function renderRows(id, n, cols) {
        const b = document.getElementById(id);
        let h = '';
        for(let i=0; i<n; i++) {
            h += '<tr>';
            for(let j=0; j<cols; j++) h += '<td><input type="text"></td>';
            h += '</tr>';
        }
        b.innerHTML = h;
    }

    function salvarDB() {
        const ins = Array.from(document.querySelectorAll('#body-db input')).map(i => i.value.trim());
        db.ref('br3_database').set(ins).then(() => alert("Sincronizado!"));
    }

    function salvarDia() {
        const dt = document.getElementById('data-dia').value;
        const pc = parseFloat(document.getElementById('v-colab').value);
        const pe = parseFloat(document.getElementById('v-emp').value);
        const rows = document.querySelectorAll('#body-daily tr');
        let novos = [];
        rows.forEach(r => {
            const v = r.querySelectorAll('input');
            if(v[0].value) novos.push({ data: dt, code: v[0].value, name: v[1].value, pC: pc, pE: pe });
        });
        let f = historico.filter(h => h.data !== dt).concat(novos);
        db.ref('br3_historico').set(f).then(() => alert("Dia Salvo!"));
    }

    function verificarData() {
        const dt = document.getElementById('data-dia').value;
        const ins = document.querySelectorAll('#body-daily input');
        ins.forEach(i => i.value = '');
        const doDia = historico.filter(h => h.data === dt);
        doDia.forEach((r, i) => {
            if(ins[i*2]) ins[i*2].value = r.code;
            if(ins[i*2+1]) ins[i*2+1].value = r.name;
        });
    }

    function gerarMensal() {
        const m = document.getElementById('filtro-mes').value;
        const res = {};
        historico.filter(h => h.data.startsWith(m)).forEach(h => {
            if(!res[h.code]) res[h.code] = { n: h.name, q: 0, tc: 0, te: 0 };
            res[h.code].q++; res[h.code].tc += h.pC; res[h.code].te += h.pE;
        });
        document.getElementById('body-mensal').innerHTML = Object.entries(res).map(([c, f]) => 
            `<tr><td>${c}</td><td>-</td><td>${f.n}</td><td>${f.q}</td><td>${f.tc.toFixed(2)}</td><td>${f.te.toFixed(2)}</td></tr>`
        ).join('');
    }

    function openTab(e, n) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(n).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    function exportarExcel() {
        let csv = "\uFEFF";
        document.querySelectorAll("#tabela-mensal tr").forEach(tr => {
            let r = []; tr.querySelectorAll("th, td").forEach(td => r.push(`"${td.innerText}"`));
            csv += r.join(";") + "\n";
        });
        const l = document.createElement("a");
        l.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        l.download = "br3_mensal.csv"; l.click();
    }
</script>
</body>
</html>
</script>
